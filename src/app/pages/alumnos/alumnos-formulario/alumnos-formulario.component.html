    <dx-form [formData]="employee" [colCount]="2" labelLocation="top">
      <dxi-item itemType="group" [colCount]="2" caption="Información personal">
        <dxi-item dataField="Identidad"></dxi-item>
        <dxi-item dataField="Primer Nombre"></dxi-item>
        <dxi-item dataField="Segundo Nombre"></dxi-item>
        <dxi-item dataField="Apellido Paterno"></dxi-item>
        <dxi-item dataField="Apellido Materno"></dxi-item>
        <dxi-item dataField="Fecha Nacimiento"></dxi-item>
        <dxi-item dataField="Sexo"></dxi-item>
        <dxi-item itemType="empty" [colSpan]="2"> </dxi-item>
        <dxi-item itemType="empty" [colSpan]="2"> </dxi-item>

        <dxi-item dataField="Correo Electronico"></dxi-item>
        <!-- <dx-text-box dataField="Teléfono" mask="+504 0000-0000" maskChar="‒"></dx-text-box> -->
        <dxi-item itemType="empty" [colSpan]="2"> </dxi-item>
        <dxi-item dataField="Dirección" [colSpan]="2"></dxi-item>
        <dxi-item dataField="Dirección" [colSpan]="2"></dxi-item>
      </dxi-item>

      <dxi-item itemType="group" caption="Información del empleado">
        <div class="dx-fieldset">
            <div class="dx-fieldset-header">Nivel educativo</div>
            <div class="dx-field">
              <dx-lookup [items]="NivelesEducativos" [value]="NivelesEducativos[0].niv_Id"  valueExpr="niv_Id"  displayExpr="niv_Descripcion">
                <dxo-drop-down-options [showTitle]="false"></dxo-drop-down-options>
                <!-- <div *dxTemplate="let item of NivelesEducativos"> -->
                  <!-- <div class="custom-field">
                     <div>{{ item.niv_Id }} {{ item.niv_Descripcion }} </div
                    >
                  </div> -->
                <!-- </div> -->
              </dx-lookup>
            </div>
          </div>
        <dxi-item dataField="Nivel educativo"></dxi-item>
        <dxi-item dataField="Curso niveles"></dxi-item>
        <dxi-item dataField="Modalidad"></dxi-item>
        <dxi-item dataField="Cursos"></dxi-item>
        <dxi-item dataField="Curso secciones"></dxi-item>
        <dxi-item dataField="Estado"></dxi-item>
      </dxi-item>
